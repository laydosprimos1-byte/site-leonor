{% extends "base.html" %}
{% block titulo %}Recuperar Senha{% endblock %}
{% block conteudo %}
<div class="glass-card">
  <h1>🔑 Recuperar Senha</h1>
  <p class="subtitulo">Informe seu email ou telefone cadastrado</p>
  <form method="POST">
    <input type="text" name="identificador" placeholder="Email ou telefone" required>
    <button class="btn-primario">Gerar link de recuperação</button>
  </form>
  <p class="rodape"><a href="{{ url_for('login') }}">← Voltar ao login</a></p>
</div>
{% endblock %}
